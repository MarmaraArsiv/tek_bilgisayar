name: README Otomatik Güncelleme

on:
  # PR merge edilince main'e push düşer; fork PR'larında da yazma izni olsun diye push kullanılıyor.
  push:
    branches: [main]
  schedule:
    # Her gün ~09:07 (TR): tam güncelleme. Saat başında GitHub yoğun olduğu için 07. dakika.
    # Onaylanan yorumları 5-6 dakikada bir form_yorum_takibi.yml taşır.
    - cron: "7 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: write   # form yorum takibini canlı tutmak için (son adım)

concurrency:
  group: readme-otomatik
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Katkıda bulunanları hesapla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/katkida_bulunanlari_guncelle.py

      - name: Doluluk durumunu üret
        run: python .github/scripts/readme_gorselleri.py

      - name: Form linkleri, oylar ve onaylı yorumlar
        run: python .github/scripts/form_linkleri.py

      - name: Değişiklik varsa commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/json_dosyalari/katkida_bulunanlar.json '*README.md'
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "README otomatik güncellendi"
          # Form yorum takibi bu arada aynı satırları yazdıysa bu çalışmanın hâli geçerli olur;
          # eksik kalan yorum olursa takip birkaç dakika içinde geri ekler.
          git pull --rebase -X theirs -q
          git push

      - name: Form yorum takibini canlı tut
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          dene() { for bekle in 0 10 30 60; do sleep $bekle; "$@" && return 0; done; return 1; }
          aktif=$(dene gh run list --workflow form_yorum_takibi.yml --event workflow_dispatch --limit 10 \
                  --json status --jq '[.[] | select(.status != "completed")] | length' || echo 0)
          if [ "${aktif:-0}" -gt 0 ]; then
            echo "Form yorum takibi zaten çalışıyor."
          else
            dene gh workflow run form_yorum_takibi.yml --ref main || echo "::warning::Form yorum takibi başlatılamadı."
          fi
